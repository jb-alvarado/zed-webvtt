<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="462" viewBox="0 0 1040 462" role="img" aria-labelledby="title desc">
<title id="title">Illustrative WebVTT syntax highlighting</title>
<desc id="desc">A WebVTT sample with CSS styles, colored region settings, cue settings, and a green speaker name. Colors are illustrative and depend on the editor theme.</desc>
<rect width="1040" height="462" rx="12" fill="#1e2430"/>
<text x="24" y="32" fill="#94a3b8" font-family="monospace" font-size="14">demo.vtt · illustrative preview</text>
